<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---- Design tokens (from Tip Jar redesign handoff) ---- */
  :root{
    /* Accent — default dark green. Curated alternates from the handoff:
       teal-navy #1d4e5c · navy #2b3a55 · olive/brass #5c4b1d */
    --accent: #1f5d46;
    --accent-wash: oklch(0.97 0.02 165 / 0.4);

    --page-bg: oklch(0.965 0.008 85);
    --card-bg: oklch(0.995 0.004 85);
    --border: oklch(0.88 0.008 85);
    --address-bg: oklch(0.98 0.004 85);
    --text-primary: oklch(0.22 0.01 85);
    --text-mono: oklch(0.4 0.01 85);
    --card-shadow: 0 30px 70px -35px oklch(0.2 0.02 85 / 0.35);

    /* Corner-style token: "soft" (default). "Sharp" alternates in comments below each rule. */
    --r-card: 28px;    /* sharp: 8px */
    --r-button: 12px;  /* sharp: 4px */
    --r-address: 14px; /* sharp: 4px */
    --r-copy: 8px;     /* sharp: 3px */
    --r-qr: 14px;      /* sharp: 4px */
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body{
    min-height: 100vh;
    width: 100%;
    background: var(--page-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 6vw, 96px) clamp(16px, 4vw, 24px);
    font-family: 'Inter', system-ui, sans-serif;
  }

  a{ color: inherit; text-decoration: none; }

  .card{
    width: 100%;
    max-width: 760px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: clamp(28px, 6vw, 64px);
    box-shadow: var(--card-shadow);
  }

  .eyebrow{
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--accent);
    margin: 0 0 18px;
  }

  h1{
    font-family: 'Source Serif 4', Georgia, serif;
    /* Reference file wraps the visible text in a font-weight: normal inner span,
       so it renders at normal weight despite the h1's own 700 — implemented
       to match that actual rendered result. Flag if 700 was intended instead. */
    font-weight: 400;
    font-size: 30px;
    line-height: 1.16;
    color: var(--text-primary);
    margin: 0 0 52px;
    max-width: 600px;
    text-wrap: pretty;
  }

  .row-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 32px;
    margin: 0 0 40px;
  }

  .label{
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
    margin: 0 0 18px;
  }

  .btn{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    padding: 16px 24px;
    border-radius: var(--r-button);
    transition: filter 0.15s ease;
  }
  .btn:hover{ filter: brightness(0.92); }

  .divider{
    border-top: 1px solid var(--border);
    margin: 0 0 40px;
  }

  .block{ margin: 0 0 40px; }
  .block:last-child{ margin-bottom: 0; }

  .qr{
    width: 128px;
    height: 128px;
    border-radius: var(--r-qr);
    display: block;
    margin: 0 0 16px;
  }

  .address-row{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--address-bg);
    border: 1px solid var(--border);
    border-radius: var(--r-address);
    padding: 14px 16px;
  }

  .address-text{
    flex: 1;
    min-width: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-mono);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .copy-btn{
    flex-shrink: 0;
    background: #fff;
    color: var(--accent);
    border: 1px solid var(--accent);
    font-weight: 600;
    font-size: 14px;
    padding: 9px 16px;
    border-radius: var(--r-copy);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .copy-btn:hover{ background: var(--accent-wash); }

  [role="status"]{
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }

  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    .btn, .copy-btn{ transition: none; }
  }
</style>
</head>

<p role="status" id="copy-status"></p>

<script>
(function(){
  var buttons = document.querySelectorAll('.copy-btn');
  var status = document.getElementById('copy-status');

  buttons.forEach(function(btn){
    btn.addEventListener('click', function(){
      var target = document.getElementById(btn.getAttribute('data-copy-target'));
      var text = target.textContent.trim();

      function markCopied(){
        var original = btn.textContent;
        btn.textContent = 'Copied';
        status.textContent = 'Copied to clipboard';
        setTimeout(function(){
          btn.textContent = original;
        }, 1500);
      }

      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(markCopied).catch(function(){
          fallbackCopy(text, markCopied);
        });
      } else {
        fallbackCopy(text, markCopied);
      }
    });
  });

  function fallbackCopy(text, done){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    done();
  }
})();
</script>
